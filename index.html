@font-face{font-family:"GT Alpina Condensed";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/GTAlpina-CondBold.otf") format("opentype")}
@font-face{font-family:"GT Alpina Condensed";font-style:italic;font-weight:700;font-display:swap;src:url("fonts/GTAlpina-CondBoldItalic.otf") format("opentype")}

/* Layout: one calm lavender column, white cards for input and results, purple headlines in condensed serif, green only on the one action. */
:root{
  --bg:#D2D6EF;
  --surface:#FFFFFF;
  --surface-2:#E9EBF7;
  --ink:#191E23;
  --muted:#5F6390;
  --purple:#2A1482;
  --line:#C2C6E5;
  --green:#00855D;
  --green-ink:#FFFFFF;
  --accent-soft:#D6EFEE;
  --tile-bg:#2A1482;--tile-fg:#D2D6EF;
  --display:"GT Alpina Condensed","GT Alpina Cond","Fraunces",Georgia,"Times New Roman",serif;
  --body:"Mabry Pro","Figtree","Helvetica Neue",Arial,sans-serif;
  --shadow:0 0 30px rgba(42,20,130,.08);
  --r-s:10px;--r-m:20px;--r-l:40px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15112E;--surface:#1F1A42;--surface-2:#2A2456;--ink:#ECEAF8;--muted:#A9A5D0;
    --purple:#CFC8FA;--line:#3A3470;--green:#2FB386;--green-ink:#0C2A20;--accent-soft:#1E3A3A;--tile-bg:#CFC8FA;--tile-fg:#15112E;
    --shadow:0 0 30px rgba(0,0,0,.25);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15112E;--surface:#1F1A42;--surface-2:#2A2456;--ink:#ECEAF8;--muted:#A9A5D0;
  --purple:#CFC8FA;--line:#3A3470;--green:#2FB386;--green-ink:#0C2A20;--accent-soft:#1E3A3A;--tile-bg:#CFC8FA;--tile-fg:#15112E;
  --shadow:0 0 30px rgba(0,0,0,.25);color-scheme:dark;
}
*{box-sizing:border-box}
html{color-scheme:light}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.444;-webkit-font-smoothing:antialiased}
a{color:var(--purple)}
.wrap{max-width:960px;margin:0 auto;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:56px}
.brand{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--purple);text-decoration:none}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.top-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;letter-spacing:.06em;padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--purple);color:var(--bg)}

/* hero */
h1{font-family:var(--display);font-weight:700;font-size:clamp(56px,10vw,104px);line-height:1;letter-spacing:-.01em;color:var(--purple);margin:0 0 28px;text-wrap:balance}
h1 em{font-style:italic}
.lead{max-width:66ch;display:grid;gap:16px;margin:0 0 36px}
.lead p{margin:0}
.lead p.strong{font-weight:700}

/* input card */
.calc{background:var(--surface);border-radius:var(--r-m);box-shadow:var(--shadow);padding:28px;display:grid;gap:18px;margin-bottom:20px}
.calc .row-label{font-weight:700;font-size:16px}
.calc form{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.calc .field{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:var(--r-s);padding:0 16px;background:var(--surface)}
.calc .field:focus-within{border-color:var(--purple)}
.calc input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:24px;font-weight:700;padding:12px 0;font-variant-numeric:tabular-nums}
.calc input::-webkit-outer-spin-button,.calc input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.calc input[type=number]{-moz-appearance:textfield}
.calc .unit{color:var(--muted);font-size:15px;white-space:nowrap}
.region{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.btn{border:0;border-radius:999px;background:var(--green);color:var(--green-ink);font:inherit;font-weight:700;font-size:17px;padding:14px 28px;cursor:pointer;transition:transform .12s ease,filter .12s ease}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.calc input:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.note{font-size:15px;color:var(--muted);margin:0 0 56px;max-width:70ch}

/* results */
.results-head{display:grid;gap:10px;margin-bottom:24px}
h2{font-family:var(--display);font-weight:700;font-size:clamp(40px,6vw,56px);line-height:1;color:var(--purple);margin:0;text-wrap:balance}
h2 em{font-style:italic}
.results-head p{margin:0;max-width:66ch}
.results-head p.region-note{font-size:15px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:40px}
.tile{background:var(--tile-bg);color:var(--tile-fg);border-radius:var(--r-m);padding:22px 22px 18px;display:grid;gap:6px;min-width:0;align-content:start}
.tile .num{font-family:var(--display);font-weight:700;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.tile .lab{font-size:15px;line-height:1.3}
.tile .src{font-size:13px;opacity:.8}

.group{background:var(--surface);border-radius:var(--r-m);box-shadow:var(--shadow);padding:28px;margin-bottom:16px}
.group header{display:grid;gap:8px;margin-bottom:18px}
h3{font-family:var(--display);font-weight:700;font-size:clamp(32px,4.5vw,40px);line-height:1;color:var(--purple);margin:0;text-wrap:balance}
.group header p{margin:0;color:var(--muted);font-size:16px;max-width:66ch}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 0 8px;border-bottom:2px solid var(--line)}
.tbl td{padding:12px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl td.count{font-family:var(--display);font-weight:700;font-size:24px;color:var(--purple);line-height:1;padding-left:16px}
.tbl td.pct{color:var(--muted);font-size:15px;padding-left:16px}
.tbl td.src{text-align:right;padding-left:16px;max-width:9em}
.tbl td.src a{font-size:14px;font-weight:700;text-decoration:none;border-bottom:1.5px solid currentColor}
.tbl td.name small{display:block;color:var(--muted);font-size:14px;line-height:1.3;margin-top:2px}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1.5px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.tile .chip{color:inherit;border-color:currentColor;opacity:.8;margin-left:0}
@media (max-width:600px){
  .tbl th.pct,.tbl td.pct{display:none}
  .group{padding:20px}
  .tbl td.count{font-size:20px}
}

/* method, sources, footer */
.method{background:var(--accent-soft);border-radius:var(--r-m);padding:28px;margin:32px 0 48px;display:grid;gap:12px}
.method h3{font-size:28px}
.method p,.method li{margin:0;font-size:16px}
.method ul{margin:0;padding-left:20px;display:grid;gap:6px}
.sources{display:grid;gap:14px;margin:0 0 48px}
.sources h3{font-size:28px}
.sources ul{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px;color:var(--muted)}
.sources a{font-weight:700;overflow-wrap:anywhere}
footer{border-top:2px solid var(--line);padding-top:24px;display:grid;gap:10px;font-size:15px;color:var(--muted)}
footer p{margin:0}
footer .mail{font-weight:700;color:var(--purple)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

</head>

             en: "Many people carry experiences of violence and discrimination. An anonymous way to report is essential to reduce the number of unreported cases. What is reported feeds back into prevention. Some groups face discrimination particularly often: according to the 2026 racism monitor, almost three quarters of racialised people (73 %) report everyday discrimination. Almost one in three trans*, inter* and non-binary people (31.8 %) experienced discrimination in the past twelve months (SOEP analysis 2026)."},
      rows: [
        {id: "harass", de: "Frauen, die sexuelle Belästigung erlebt haben", en: "Women who have experienced sexual harassment", g: "women", DE: v(62.3, S.lesubia, B.lesubia)},
        {de: "Männer, die sexuelle Belästigung erlebt haben", en: "Men who have experienced sexual harassment", g: "men", DE: v(28.6, S.lesubia, B.lesubia)},
        {de: "Menschen, die selbst Rassismus erlebt haben", en: "People who have experienced racism themselves", DE: v(22.2, S.nadira22, B.nadira22)},
        {de: "Menschen, die in den letzten 12 Monaten Diskriminierung erlebt haben", en: "People who experienced discrimination in the past 12 months", DE: v(13.1, S.soep, B.soep)},
        {de: "Rassistisch markierte Menschen (Mindestschätzung)", en: "Racialised people (minimum estimate)", DE: v(6.5, S.soep, B.soepRace)},
        {de: "Queere Menschen (LGBTQIA+)", en: "Queer people (LGBTQIA+)", DE: v(12, S.ipsos25, B.ipsos25)},
        {de: "Frauen, die einen sexuellen Übergriff erlebt haben", en: "Women who have experienced sexual assault", g: "women", DE: v(17.8, S.lesubia, B.lesubia), EU: v(17.2, S.gbv, B.gbv)},
        {de: "Frauen, denen K.-o.-Tropfen verabreicht wurden", en: "Women whose drinks were spiked with knock-out drops", g: "women", DE: v(6.7, S.lesubia, B.lesubia)},
        {de: "Männer, die einen sexuellen Übergriff erlebt haben", en: "Men who have experienced sexual assault", g: "men", DE: v(4.3, S.lesubia, B.lesubia)},
        {de: "Männer, denen K.-o.-Tropfen verabreicht wurden", en: "Men whose drinks were spiked with knock-out drops", g: "men", DE: v(3.7, S.lesubia, B.lesubia)},
        {de: "Trans*, nicht-binäre oder genderfluide Menschen", en: "Trans*, non-binary or genderfluid people", DE: v(1, S.ipsos24, B.ipsos24)}
      ]
    }
  ];

  var TILES = ["psych", "harass", "hear"];

  var lang = "de", region = "DE";
  try { var sl = localStorage.getItem("wvm-lang"); if (sl === "de" || sl === "en") lang = sl; else if (!/^de/i.test(navigator.language || "")) lang = "en"; } catch (e) { if (!/^de/i.test(navigator.language || "")) lang = "en"; }
  try { var sr = localStorage.getItem("wvm-region"); if (sr === "DE" || sr === "EU") region = sr; } catch (e) {}

  function L(x){ return (x && typeof x === "object") ? x[lang] : x; }
  function t(k){ return T[lang][k]; }
  function nf(){ return new Intl.NumberFormat(lang === "de" ? "de-DE" : "en-GB"); }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  function count(n, pct){
    var x = n * pct / 100;
    if (x < 1) return x > 0 ? t("under1") : "0";
    x = x >= 1000 ? Math.round(x / 10) * 10 : Math.round(x);
    return nf().format(x);
  }
  function pctText(pct){
    var loc = lang === "de" ? "de-DE" : "en-GB";
    var r = Math.round(pct * 10) / 10;
    return r.toLocaleString(loc, {minimumFractionDigits: Number.isInteger(r) ? 0 : 1, maximumFractionDigits: 1}) + " %";
  }

  /* Wert für die gewählte Region; fehlt ein EU-Wert, gilt der deutsche mit Hinweis */
  function pick(r){
    if (region === "EU" && r.EU) return {val: r.EU, chip: ""};
    var chip = r.world ? t("chipWorld") : (region === "EU" ? t("chipDE") : "");
    return {val: r.DE, chip: chip};
  }
  function share(r, val){ return r.g ? val.p / 2 : val.p; }
  function note(r, val, n){
    if (!r.g) return L(val.b);
    var who = t(r.g);
    return t("genderNote").replace(/\{rate\}/g, pctText(val.p)).replace(/\{who\}/g, who)
      .replace("{base}", L(val.b)).replace("{half}", nf().format(Math.round(n / 2))).replace("{whoDat}", t(r.g + "Dat"));
  }

  function renderStatic(){
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = t(el.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-html]").forEach(function(el){ el.innerHTML = t(el.getAttribute("data-i18n-html")); });
    document.getElementById("region-de").textContent = t("DE");
    document.getElementById("region-eu").textContent = t("EU");
    document.querySelectorAll("[data-lang]").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false"); });
    document.querySelectorAll("[data-region]").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-region") === region ? "true" : "false"); });
    document.getElementById("region-note").hidden = region !== "EU";
    document.getElementById("method-list").innerHTML = t("method").map(function(m){ return "<li>" + esc(m) + "</li>"; }).join("");
  }

  function renderSources(){
    var seen = [];
    GROUPS.forEach(function(g){ g.rows.forEach(function(r){
      [r.DE, r.EU].forEach(function(x){ if (x && seen.indexOf(x.s) < 0) seen.push(x.s); });
    }); });
    [S.nadira26].forEach(function(x){ if (seen.indexOf(x) < 0) seen.push(x); });
    document.getElementById("source-list").innerHTML = seen.map(function(s){
      return "<li>" + esc(L(s.t)) + '. <a href="' + esc(s.u) + '" target="_blank" rel="noopener">' + esc(t("toSource")) + "</a></li>";
    }).join("");
  }

  function render(n){
    document.getElementById("result-title").innerHTML = t("resultTitle").replace("{n}", nf().format(n));

    var byId = {};
    GROUPS.forEach(function(g){ g.rows.forEach(function(r){ if (r.id) byId[r.id] = r; }); });
    document.getElementById("tiles").innerHTML = TILES.map(function(id){
      var r = byId[id], p = pick(r);
      return '<div class="tile"><div class="num">' + count(n, share(r, p.val)) + '</div><div class="lab">' + esc(L(r)) + "</div>"
        + '<div class="src">' + esc(p.val.s.k) + (p.chip ? ' <span class="chip">' + esc(p.chip) + "</span>" : "") + "</div></div>";
    }).join("");

    var h = "";
    GROUPS.forEach(function(g){
      var rows = g.rows.map(function(r){ var p = pick(r); return {r: r, p: p, s: share(r, p.val)}; })
        .sort(function(a, b){ return b.s - a.s; });
      h += '<section class="group"><header><h3>' + esc(L(g.title)) + "</h3><p>" + esc(L(g.hint)) + "</p></header>";
      h += '<table class="tbl"><thead><tr><th>' + esc(t("thName")) + '</th><th class="n pct">' + esc(t("thPct")) + '</th><th class="n">' + esc(t("thCount")) + '</th><th class="n">' + esc(t("thSrc")) + "</th></tr></thead><tbody>";
      rows.forEach(function(x){
        var r = x.r, val = x.p.val;
        h += '<tr><td class="name">' + esc(L(r)) + (x.p.chip ? '<span class="chip">' + esc(x.p.chip) + "</span>" : "")
           + "<small>" + esc(note(r, val, n)) + "</small></td>"
           + '<td class="n pct">' + pctText(x.s) + "</td>"
           + '<td class="n count">' + count(n, x.s) + "</td>"
           + '<td class="src"><a href="' + esc(val.s.u) + '" target="_blank" rel="noopener" title="' + esc(L(val.s.t)) + '">' + esc(val.s.k) + "</a></td></tr>";
      });
      h += "</tbody></table></section>";
    });
    document.getElementById("groups").innerHTML = h;
  }

  var input = document.getElementById("visitors");
  function current(){
    var x = parseInt(input.value, 10);
    if (!isFinite(x) || x < 1) x = 50000;
    if (x > 100000000) x = 100000000;
    return x;
  }
  function all(){ renderStatic(); renderSources(); render(current()); }

  document.getElementById("calc-form").addEventListener("submit", function(e){
    e.preventDefault();
    input.value = current();
    render(current());
    var el = document.getElementById("result-title");
    if (el && el.scrollIntoView) el.scrollIntoView({behavior: "smooth", block: "start"});
  });
  var timer;
  input.addEventListener("input", function(){
    clearTimeout(timer);
    timer = setTimeout(function(){ render(current()); }, 250);
  });
  document.querySelectorAll("[data-lang]").forEach(function(b){
    b.addEventListener("click", function(){
      lang = b.getAttribute("data-lang");
      try { localStorage.setItem("wvm-lang", lang); } catch (e) {}
      all();
    });
  });
  document.querySelectorAll("[data-region]").forEach(function(b){
    b.addEventListener("click", function(){
      region = b.getAttribute("data-region");
      try { localStorage.setItem("wvm-region", region); } catch (e) {}
      renderStatic(); render(current());
    });
  });
  all();
})();
</script>
</body>
</html>
